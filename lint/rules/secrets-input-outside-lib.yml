id: secrets-input-outside-lib
language: nix
severity: error
message: Reference nix-secrets files through `configLib.secretFile "sops/…"`; using `inputs.secrets` directly copies the whole secrets repo into the store.
files:
  - hosts/**
  - modules/**
  - roles/**
  - users/**
  - pkgs/**
  - overlays/**
rule:
  kind: select_expression
  regex: '^inputs\.secrets(\.|$)'
