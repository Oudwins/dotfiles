id: sops-secrets-in-module
language: nix
severity: error
message: Modules take secrets as file paths; the host, user or role declares `sops.secrets`.
files:
  - modules/**
ignores:
  # Baseline: files that already broke this rule when it was added. Only remove entries.
  - modules/nixos/core/restic-backup.nix
  - modules/nixos/core/tailscale.nix
  - modules/nixos/desktop/filesystems/default.nix
  - modules/nixos/services/hermes-agent/default.nix
  - modules/nixos/services/matrix/default.nix
  - modules/nixos/services/matrix/whatsapp.nix
  - modules/nixos/services/mealie/backup.nix
  - modules/nixos/services/mealie/default.nix
  - modules/nixos/services/media-server/custom.nix
  - modules/nixos/services/metrics/default.nix
  - modules/nixos/services/nextcloud/default.nix
  - modules/nixos/services/nextcloud/docs/onlyOffice_NOT_WORKING/default.nix
  - modules/nixos/services/ntfy/default.nix
  - modules/nixos/services/paperless/default.nix
  - modules/nixos/services/ssl/cloudflare/default.nix
  - modules/nixos/services/syncthing/default.nix
  - modules/nixos/services/vaultwarden/default.nix
  - modules/nixos/services/wordpress/ssl.nix
rule:
  kind: binding
  any:
    - has: { field: attrpath, regex: '^sops\.secrets(\.|$)' }
    - all:
        - has: { field: attrpath, regex: '^secrets(\.|$)' }
        - inside:
            kind: binding
            stopBy: { kind: binding }
            has: { field: attrpath, regex: '^sops$' }
