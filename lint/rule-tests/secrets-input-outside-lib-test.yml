id: secrets-input-outside-lib
valid:
  - |
    { configLib, ... }: { sops.defaultSopsFile = configLib.secretFile "sops/hosts/rizos.yaml"; }
invalid:
  - |
    { inputs, ... }: { sops.defaultSopsFile = "${inputs.secrets}/sops/hosts/rizos.yaml"; }
  - |
    { inputs, ... }: { sops.defaultSopsFile = inputs.secrets.outPath + "/sops/hosts/rizos.yaml"; }
