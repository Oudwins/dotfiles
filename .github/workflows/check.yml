name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` runs steps with `-eo pipefail`, so a failed `nix eval` in the
# masking pipeline fails the job instead of silently masking nothing.
defaults:
  run:
    shell: bash

# Every job evaluates the private nix-secrets input, so each one:
#   1. loads the read-only deploy key (NIX_SECRETS_DEPLOY_KEY), and
#   2. masks every soft-secret value BEFORE anything else is printed.
# Pull requests from forks never receive secrets, so they are skipped.

jobs:
  eval:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - name: Mask soft secrets
        run: |
          mask=$(nix eval --json .#ci.mask 2>/dev/null)
          [ "$(jq length <<<"$mask")" -gt 0 ] || { echo "No soft-secret values to mask" >&2; exit 1; }
          jq -r '.[] | split("\n")[] | select(length > 0)' <<<"$mask" \
            | while IFS= read -r value; do echo "::add-mask::$value"; done
      - name: Masking canary (the next line must read canary.***)
        run: |
          domain=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.secrets.soft.values.global.domain' 2>/dev/null)
          echo "canary.$domain"
      - name: Evaluate every host and package
        run: SECRETS=pinned nix shell nixpkgs#just -c just check
      - id: hosts
        name: List hosts to build
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: eval
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.eval.outputs.hosts) }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - name: Mask soft secrets
        run: |
          mask=$(nix eval --json .#ci.mask 2>/dev/null)
          [ "$(jq length <<<"$mask")" -gt 0 ] || { echo "No soft-secret values to mask" >&2; exit 1; }
          jq -r '.[] | split("\n")[] | select(length > 0)' <<<"$mask" \
            | while IFS= read -r value; do echo "::add-mask::$value"; done
      - name: Build ${{ matrix.host }}
        run: nix build --no-link --no-update-lock-file -L .#checks.x86_64-linux.nixos-${{ matrix.host }}

  packages:
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
      - name: Mask soft secrets
        run: |
          mask=$(nix eval --json .#ci.mask 2>/dev/null)
          [ "$(jq length <<<"$mask")" -gt 0 ] || { echo "No soft-secret values to mask" >&2; exit 1; }
          jq -r '.[] | split("\n")[] | select(length > 0)' <<<"$mask" \
            | while IFS= read -r value; do echo "::add-mask::$value"; done
      - name: Build custom packages
        run: |
          nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | ".#packages.x86_64-linux.\(.)"' \
            | xargs nix build --no-link --no-update-lock-file -L
