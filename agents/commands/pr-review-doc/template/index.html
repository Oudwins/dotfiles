<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR review</title>
    <link rel="icon" href="data:," />
    <style>/* STYLE */</style>
  </head>
  <body>
    <nav id="tabbar"></nav>
    <div id="banner" hidden></div>
    <main id="tabs"></main>
    <aside id="inspector" hidden>
      <div id="inspector-head">
        <strong id="inspector-title"></strong>
        <span class="type-hint">Relevant branches first</span>
        <button id="inspector-expand" type="button">Expand all</button>
        <button id="inspector-collapse" type="button">Collapse nested</button>
        <button id="inspector-pin" type="button">Pin</button>
        <button id="inspector-close" type="button" title="Close (gq)">✕</button>
      </div>
      <div id="inspector-body"></div>
    </aside>
    <div id="help" hidden></div>
    <div id="palette" hidden>
      <input id="palette-input" autocomplete="off" spellcheck="false" placeholder="Type a command" />
      <ul id="palette-list"></ul>
    </div>
    <input id="prompt" hidden autocomplete="off" spellcheck="false" />
    <footer id="statusline">
      <span id="mode"></span>
      <span id="keys"></span>
      <span id="where"></span>
      <span id="message"></span>
      <span id="comments"></span>
      <span id="progress"></span>
    </footer>
    <script id="data" type="application/json">/* DATA */</script>
    <script>/* SCRIPT */</script>
  </body>
</html>
