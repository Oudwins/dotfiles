model_provider = "cliproxyapi"
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[model_providers.cliproxyapi]
name = "CLIProxyAPI"
base_url = "http://127.0.0.1:28760/llmproxy/v1"
model_catalog_url = "http://127.0.0.1:28760/llmproxy/v1/models"
wire_api = "responses"
requires_openai_auth = false
experimental_bearer_token = "local"
supports_websockets = true

[features]
api_key_model_discovery = true

[mcp_servers.executor]
url = "http://127.0.0.1:28760/executor"
startup_timeout_sec = 60

[tui]
screen_reader_detection_done = true

[projects."/Users/tmx/dotfiles"]
trust_level = "trusted"

[projects."/home/tmx/dotfiles"]
trust_level = "trusted"

[projects."/Users/tmx/nix-secrets"]
trust_level = "trusted"

[projects."/home/tmx/nix-secrets"]
trust_level = "trusted"
