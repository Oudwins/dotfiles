# Tracked settings. Put real keys in the Git-ignored secrets.yaml alongside this file.
# https://help.router-for.me/configuration/options.html
config-version: 8

server:
  host: "127.0.0.1"
  port: 8317

access:
  # Overridden by secrets.yaml. This placeholder disables proxy endpoints until configured.
  api-keys:
    - "your-api-key-1"

api-keys:
  # Native Responses upstream, using an ordinary OpenAI API key (not OAuth).
  codex:
    - name: openai
      base-url: "https://api.openai.com/v1"
      models:
        # Latest non-deprecated text LLMs per family/tier, checked 2026-10-08.
        # https://developers.openai.com/api/docs/models
        # Requests stay on /v1/responses upstream for reasoning and tool support.
        - name: "gpt-6-astra"
          alias: "gpt-6-astra"
          thinking:
            levels: ["low", "medium", "high", "xhigh", "max"]
        - name: "gpt-6.1-sol"
          alias: "gpt-6.1-sol"
          thinking:
            levels: ["low", "medium", "high", "xhigh", "max"]
        - name: "gpt-6-luna"
          alias: "gpt-6-luna"
          thinking:
            levels: ["none", "low", "medium", "high", "xhigh", "max"]
        - name: "gpt-5.6-terra"
          alias: "gpt-5.6-terra"
          thinking:
            levels: ["none", "low", "medium", "high", "xhigh", "max"]

multimedia:
  # Do not inject an image-generation tool into text/coding requests.
  disable-image-generation: "passthrough"

oauth:
  # Keep mutable OAuth tokens outside the Stow-managed dotfiles tree.
  auth-dir: "~/.local/share/cli-proxy-api/auth"
  providers:
    aistudio:
      ws-auth: true

management:
  allow-remote: true
  # Keep the real management key in secrets.yaml; empty disables the management API.
  secret-key: "key"
  disable-control-panel: false

routing:
  strategy: "round-robin"
  # Keep a conversation on the same credential for prompt-cache reuse.
  session-affinity: true
  session-affinity-ttl: "1h"

requests:
  streaming:
    keepalive-seconds: 15
    bootstrap-retries: 1

observability:
  logs:
    debug: false
    request-log: false
    logging-to-file: true
    logs-max-total-size-mb: 100
    error-logs-max-files: 10
