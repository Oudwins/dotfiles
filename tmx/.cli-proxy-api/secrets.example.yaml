# Copy to secrets.yaml, which is Git-ignored, then replace the placeholder key.
# Generate keys with: openssl rand -hex 32
# These values override config.yaml at launch; nested mappings are merged,
# while lists (including client keys and models) are replaced, not appended.
# Exception: upstream api-keys.<provider> groups merge by their unique name.
access:
  api-keys: []

# Optional management key (different from the client key):
# management:
#   secret-key: "replace-with-a-separate-random-key"

# Match the provider group name in config.yaml to supply only its keys:
# api-keys:
#   openai-compatibility:
#     - name: openai
#       keys:
#         - api-key: "sk-YOUR_OPENAI_KEY"
# Keep base-url, models and other ordinary group settings in config.yaml.
# OAuth tokens are already stored separately, outside the dotfiles tree.
